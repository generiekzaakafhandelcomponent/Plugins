spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:54341/slack-test
    username: test-user
    password: password
    hikari:
      auto-commit: false
  liquibase:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql
    show_sql: true
    open-in-view: false
    properties:
      hibernate:
        hbm2ddl.auto: none
        generate_statistics: false
        naming-strategy: org.springframework.boot.orm.jpa.hibernate.SpringNamingStrategy
        cache:
          use_second_level_cache: false
          use_query_cache: false
          region.factory_class: org.hibernate.cache.ehcache.SingletonEhCacheRegionFactory
        format_sql: true
        jdbc:
          time_zone: UTC
        connection:
          provider_disables_autocommit: true
    hibernate:
      ddl-auto: none

camunda:
  bpm:
    generic-properties:
      properties:
        enforceHistoryTimeToLive: false

spring-actuator:
  username: test
  password: test

valtimo:
  plugin:
    encryption-secret: "abcdefghijklmnop"
  database: postgres
  slack:
    # The poller bean is wired up so that the context is still verified, but its cron is
    # pushed out of reach: a scheduled run firing mid-test would read a channel the test
    # under way did not ask about. Tests that exercise the poller call it directly.
    poll-cron: "0 0 4 1 1 *"
    retention-cron: "0 30 4 1 1 *"

logging:
  level:
    org.springframework.beans: DEBUG
    reactor.netty.http.client.HttpClient: DEBUG
    com.ritense.valtimoplugins.slack: DEBUG
