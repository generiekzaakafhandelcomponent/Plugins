# Local stand-in for a gateway that demands a client certificate (mutual TLS) in front of the ZGW APIs.
#   https://127.0.0.1:8443 -> Objecten API
#   https://127.0.0.1:8444 -> Open Zaak
#   https://127.0.0.1:8445 -> Open Notificaties
# Requests without a client certificate signed by certs/ca.pem are refused.

events {}

http {
    # resolve upstreams per request, so the gateway starts even when only some ZGW services run
    resolver 127.0.0.11 valid=10s ipv6=off;

    # logs only the scheme of the Authorization header (Token, Bearer), never its secret
    map $http_authorization $auth_scheme {
        default        "";
        "~^(?<s>\S+)"  $s;
    }

    log_format mtls '$remote_addr "$request" $status client="$ssl_client_s_dn" verify=$ssl_client_verify '
                    'authorization="$auth_scheme"';
    access_log /dev/stdout mtls;
    error_log /dev/stderr info;

    ssl_certificate         /etc/nginx/certs/server.pem;
    ssl_certificate_key     /etc/nginx/certs/server-key.pem;
    ssl_client_certificate  /etc/nginx/certs/ca.pem;
    ssl_verify_client       on;

    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Proto  https;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-SSL-Client-S-DN  $ssl_client_s_dn;
    # the APIs build their own URLs as http://<Host>; rewrite them to the https gateway address
    proxy_set_header Accept-Encoding    "";
    sub_filter       "http://$http_host" "https://$http_host";
    sub_filter_once  off;
    sub_filter_types application/json application/hal+json application/problem+json;

    server {
        listen 8443 ssl;
        location / {
            set $upstream http://objecten-api:8000;
            proxy_pass $upstream;
        }
    }

    server {
        listen 8444 ssl;
        location / {
            set $upstream http://openzaak:8000;
            proxy_pass $upstream;
        }
    }

    server {
        listen 8445 ssl;
        location / {
            set $upstream http://open-notificaties:8000;
            proxy_pass $upstream;
        }
    }
}
