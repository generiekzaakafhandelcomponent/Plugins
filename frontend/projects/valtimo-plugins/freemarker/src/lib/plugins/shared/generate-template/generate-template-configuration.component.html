<ng-container *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null,
    templateItems: templateItems$ | async,
    valueResolverItems: valueResolverItems$ | async,
    loading: loading$ | async,
    selectedInputType: selectedInputType$ | async,
    defaultInputType: defaultInputType$ | async,
  } as obs"
>
    <ng-container *ngIf="obs.loading === false; else loading">
        <v-paragraph [margin]="true" [italic]="true">
            {{ descriptionKey | pluginTranslate: pluginId | async }}
        </v-paragraph>
        <v-form (valueChange)="formValueChange($event)">
            <v-radio
                    name="templateKeyInputType"
                    [disabled]="obs.disabled"
                    [title]="keyTitleKey | pluginTranslate: pluginId | async"
                    [tooltip]="keyTooltipKey | pluginTranslate: pluginId | async"
                    [radioValues]="inputTypeRadioValues$ | async"
                    [defaultValue]="obs.defaultInputType"
                    [margin]="true"
            ></v-radio>

            <v-select
                    *ngIf="obs.selectedInputType === 'selection'"
                    [items]="obs.templateItems"
                    [margin]="true"
                    [widthInPx]="350"
                    [name]="keyFieldName"
                    [disabled]="obs.disabled"
                    [defaultSelectionId]="prefillKey(obs.prefill)"
                    [required]="true"
                    [loading]="!obs.templateItems"
            ></v-select>

            <v-input
                    *ngIf="obs.selectedInputType === 'text'"
                    [name]="keyFieldName"
                    [margin]="true"
                    [defaultValue]="prefillKey(obs.prefill)"
                    [disabled]="obs.disabled"
                    [required]="true"
                    placeholder="pv:myTemplateKey"
            ></v-input>

            <v-select
                    *ngIf="obs.selectedInputType === 'value-resolver'"
                    [items]="obs.valueResolverItems"
                    [margin]="true"
                    [widthInPx]="350"
                    [name]="keyFieldName"
                    [disabled]="obs.disabled"
                    [defaultSelectionId]="prefillKey(obs.prefill)"
                    [required]="true"
                    [loading]="!obs.valueResolverItems"
            ></v-select>

            <v-input
                    name="processVariableName"
                    [title]="'processVariableName' | pluginTranslate: pluginId | async"
                    [margin]="true"
                    [defaultValue]="obs.prefill?.processVariableName || defaultProcessVariableName"
                    [disabled]="obs.disabled"
                    [tooltip]="'processVariableNameTooltip' | pluginTranslate: pluginId | async"
            ></v-input>
        </v-form>
    </ng-container>
</ng-container>

<ng-template #loading>
    <div class="loading-container">
        <cds-loading></cds-loading>
    </div>
</ng-template>
